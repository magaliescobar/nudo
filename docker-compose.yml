# Multi-instancia local (R04): 3 instancias de UNA imagen + nginx. Sin servicios de Mongo ni Redis:
# usan Atlas y el Redis existente del host (variables de .env.local, §3.7).
#   pnpm env:secrets            # una vez: agrega INTERNAL_API_SECRET y la clave de Server Actions
#   NEXT_DEPLOYMENT_ID=$(git rev-parse --short HEAD) docker compose up --build -d
#   curl -I http://localhost:8080/es   # mirar x-instance-id
name: nudo

x-web-env: &web-env
  REDIS_DRIVER: tcp
  CACHE_L1_PUBSUB: "true"
  NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
  NEXT_PUBLIC_SITE_URL: http://localhost:8080

x-web: &web
  image: nudo-web:${NEXT_DEPLOYMENT_ID:-local}
  pull_policy: never
  env_file: [.env.local]
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped
  stop_grace_period: 5s

services:
  web-1:
    <<: *web
    build:
      context: .
      args:
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
    environment:
      <<: *web-env
      INSTANCE_ID: web-1

  web-2:
    <<: *web
    depends_on: [web-1]
    environment:
      <<: *web-env
      INSTANCE_ID: web-2

  web-3:
    <<: *web
    depends_on: [web-1]
    environment:
      <<: *web-env
      INSTANCE_ID: web-3

  proxy:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on: [web-1, web-2, web-3]
    restart: unless-stopped

volumes:
  nginx-cache:
