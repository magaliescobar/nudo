# Entrada de tráfico (R04, ADR 007): round-robin SIN afinidad entre 3 instancias de la misma build.
# Caché compartida de assets inmutables y de /_next/image en la entrada (ADR 008).
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format json escape=json '{"ts":"$time_iso8601","request_id":"$nudo_request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream":"$upstream_addr","instance":"$upstream_http_x_instance_id",'
    '"upstream_ms":"$upstream_response_time","cache":"$upstream_cache_status"}';
  access_log /dev/stdout json;

  proxy_cache_path /var/cache/nginx/nudo levels=1:2 keys_zone=nudo_assets:20m max_size=1g
    inactive=7d use_temp_path=off;

  upstream nudo_pool {
    # Estado compartido entre workers: sin esto cada worker arranca su round-robin en web-1.
    zone nudo_pool 64k;
    server web-1:3000 max_fails=1 fail_timeout=5s;
    server web-2:3000 max_fails=1 fail_timeout=5s;
    server web-3:3000 max_fails=1 fail_timeout=5s;
    keepalive 32;
  }

  # Solo para pruebas locales: `x-nudo-instance: web-2` fuerza la instancia (tests R04).
  map $http_x_nudo_instance $nudo_upstream {
    default nudo_pool;
    web-1   web-1:3000;
    web-2   web-2:3000;
    web-3   web-3:3000;
  }

  map $http_x_request_id $nudo_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  server {
    listen 8080;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $nudo_request_id;
    # Si una instancia cae, los GET se reintentan en otra; POST no (no idempotente).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    # Assets con hash: idénticos en todas las instancias (misma build).
    location /_next/static/ {
      proxy_pass http://nudo_pool;
      proxy_cache nudo_assets;
      proxy_cache_valid 200 7d;
      add_header X-Cache $upstream_cache_status always;
    }

    # Optimizador de imágenes: una sola copia por variante (url/w/q/formato) en la entrada.
    location /_next/image {
      proxy_pass http://nudo_pool;
      proxy_cache nudo_assets;
      proxy_cache_key "$request_uri$http_accept";
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_502 http_503;
      add_header X-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://$nudo_upstream;
      # RSC/PPR transmiten en streaming: no bufferear.
      proxy_buffering off;
    }
  }
}
